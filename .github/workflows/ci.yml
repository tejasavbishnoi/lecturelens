name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    name: Backend (install + health check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start server and check /api/health
        env:
          PORT: 5001
          GEMINI_API_KEY: ci-placeholder
        run: |
          node index.js &
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5001/api/health; then exit 0; fi
            sleep 1
          done
          echo "Server did not respond" && exit 1

  docker:
    name: Docker image (build + health check)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lecturelens-api ./server
      - name: Run container and check /api/health
        run: |
          docker run -d --name api -p 5001:5001 -e GEMINI_API_KEY=ci-placeholder lecturelens-api
          for i in $(seq 1 20); do
            if curl -fs http://localhost:5001/api/health; then docker rm -f api; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
