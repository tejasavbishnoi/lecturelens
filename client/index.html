<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LectureLens · AI study companion</title>
    <meta
      name="description"
      content="Turn any YouTube lecture or recording into AI study notes, flashcards, quizzes and a chat tutor."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0f14" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Discord). Set VITE_SITE_URL on Vercel. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LectureLens" />
    <meta property="og:title" content="LectureLens · AI study companion" />
    <meta
      property="og:description"
      content="Turn any YouTube lecture or recording into notes, flashcards, quizzes and a chat tutor."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LectureLens · AI study companion" />
    <meta
      name="twitter:description"
      content="Turn any YouTube lecture or recording into notes, flashcards, quizzes and a chat tutor."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before the page paints, so there's no flash -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("lecturelens:theme") || "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
